<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="300" rx="14" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Title -->
  <text x="460" y="32" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">
    DETERMINISTIC FINITE STATE MACHINE (3-CONSECUTIVE FAILURES BRUTE-FORCE DETECTOR)
  </text>
  <text x="460" y="50" fill="#06b6d4" font-size="11" font-family="sans-serif" text-anchor="middle">
    M = (Q, Σ, δ, q0, F) | Q = { S0, S1, S2, S3 } | Σ = { F (Failed), S (Success) } | F = { S3 }
  </text>

  <!-- Start Arrow -->
  <line x1="30" y1="160" x2="65" y2="160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)" />
  <text x="35" y="150" fill="#60a5fa" font-size="11" font-family="sans-serif">Start</text>

  <!-- S0 Self Loop on S -->
  <path d="M 100,118 C 80,70 140,70 120,118" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <text x="110" y="68" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">S</text>

  <!-- Forward S0 -> S1 (F) -->
  <line x1="155" y1="160" x2="285" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <text x="220" y="152" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">F</text>

  <!-- Reset S1 -> S0 (S) -->
  <path d="M 330,120 Q 220,50 110,120" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
  <text x="220" y="72" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">S (Reset)</text>

  <!-- Forward S1 -> S2 (F) -->
  <line x1="375" y1="160" x2="505" y2="160" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <text x="440" y="152" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">F</text>

  <!-- Reset S2 -> S0 (S) -->
  <path d="M 550,120 Q 330,15 105,120" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
  <text x="330" y="44" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">S (Reset)</text>

  <!-- Forward S2 -> S3 (F: TRIGGER ALERT) -->
  <line x1="595" y1="160" x2="725" y2="160" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowRed)" />
  <text x="660" y="152" fill="#fca5a5" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">F (ALERT!)</text>

  <!-- Reset S3 -> S0 (S) -->
  <path d="M 770,120 Q 440,-20 100,120" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
  <text x="440" y="24" fill="#10b981" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">S (Clear Alert & Reset)</text>

  <!-- S3 Self Loop on F (Maintain Alert State) -->
  <path d="M 790,125 C 840,75 840,245 790,195" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)" />
  <text x="850" y="165" fill="#ef4444" font-size="12" font-weight="bold" font-family="sans-serif">F (Maintain)</text>

  <!-- Nodes -->
  <!-- Node S0 -->
  <g transform="translate(110, 160)">
    <circle r="44" fill="#111c38" stroke="#10b981" stroke-width="3" filter="url(#glowGreen)" />
    <text y="-6" fill="#ffffff" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">S0</text>
    <text y="14" fill="#6ee7b7" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">NORMAL</text>
    <text y="26" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">0 failures</text>
  </g>

  <!-- Node S1 -->
  <g transform="translate(330, 160)">
    <circle r="44" fill="#111c38" stroke="#f59e0b" stroke-width="3" />
    <text y="-6" fill="#ffffff" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">S1</text>
    <text y="14" fill="#fde68a" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">1 FAILURE</text>
    <text y="26" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Monitored</text>
  </g>

  <!-- Node S2 -->
  <g transform="translate(550, 160)">
    <circle r="44" fill="#111c38" stroke="#f97316" stroke-width="3" />
    <text y="-6" fill="#ffffff" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">S2</text>
    <text y="14" fill="#fdba74" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">2 FAILURES</text>
    <text y="26" fill="#94a3b8" font-size="9" font-family="sans-serif" text-anchor="middle">Threat Imminent</text>
  </g>

  <!-- Node S3 (Accepting Double Ring) -->
  <g transform="translate(770, 160)">
    <circle r="46" fill="#111c38" stroke="#ef4444" stroke-width="3" filter="url(#glowRed)" />
    <circle r="39" fill="none" stroke="#ef4444" stroke-width="2" />
    <text y="-6" fill="#ffffff" font-size="18" font-weight="bold" font-family="monospace" text-anchor="middle">S3</text>
    <text y="14" fill="#fca5a5" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">ALERT STATE</text>
    <text y="26" fill="#ef4444" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">&gt;= 3 failures</text>
  </g>

  <!-- Legend -->
  <g transform="translate(140, 260)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />
    <text x="36" y="14" fill="#94a3b8" font-size="11" font-family="sans-serif">Input F (Failed Connection)</text>

    <line x1="220" y1="10" x2="250" y2="10" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
    <text x="256" y="14" fill="#94a3b8" font-size="11" font-family="sans-serif">Input S (Successful Login / Reset)</text>

    <circle cx="480" cy="10" r="8" fill="#111c38" stroke="#ef4444" stroke-width="2" />
    <circle cx="480" cy="10" r="5" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <text x="495" y="14" fill="#94a3b8" font-size="11" font-family="sans-serif">Accepting / Security Alert State (S3)</text>
  </g>
</svg>
